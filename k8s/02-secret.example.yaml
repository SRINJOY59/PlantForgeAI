# TEMPLATE ONLY — do not commit a filled-in copy. Create the real Secret from
# your .env with the one-liner in the README (kubectl create secret ... --from-env-file),
# so the values never live in the repo. This file documents the keys the pods
# expect so you know what must be present.
#
# Keys consumed by the app (from .env):
#   NEO4J_PASSWORD          - neo4j auth (also used by the StatefulSet + init job)
#   MINIO_PASSWORD          - MinIO root password
#   SUPABASE_JWT_SECRET     - gateway verifies user JWTs with this (prod auth ON)
#   GEMINI_API_KEY          - AI Studio fallback (Vertex is primary via Workload Identity)
#   OPENROUTER_API_KEY      - optional fallback provider
#   DEEPGRAM_API_KEY        - interview voice STT/TTS
#   CARTESIA_API_KEY        - optional interview TTS
#   ELEVENLABS_API_KEY      - optional interview TTS
#   SLACK_WEBHOOK_URL       - critical-alarm notifications (optional)
#   SLACK_ENABLED           - "true" to turn Slack on
#   SLACK_SIGNING_SECRET    - Slack app signing secret. Required for the
#                             Approve/Reject BUTTONS on a work-order approval
#                             request; without it those callbacks are refused.
#   SLACK_APPROVAL_SECRET   - HMAC key for the signed approval LINKS on the
#                             same message. Long and random. Rotating it
#                             invalidates every link already sitting in Slack.
#   TIMESCALE_DSN           - historian + diagnostics (optional; unset = disabled)
#   TURN_SECRET             - coturn shared secret; the interview mints time-limited
#                             TURN credentials from it. Generate: openssl rand -hex 32
#
apiVersion: v1
kind: Secret
metadata:
  name: plantmind-secrets
  namespace: plantmind
type: Opaque
stringData:
  NEO4J_PASSWORD: "CHANGE_ME"
  MINIO_PASSWORD: "CHANGE_ME"
  SUPABASE_JWT_SECRET: "CHANGE_ME"
  GEMINI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  CARTESIA_API_KEY: ""
  ELEVENLABS_API_KEY: ""
  SLACK_WEBHOOK_URL: ""
  SLACK_ENABLED: "false"
  SLACK_SIGNING_SECRET: ""
  SLACK_APPROVAL_SECRET: ""
  TIMESCALE_DSN: ""
  TURN_SECRET: "CHANGE_ME"          # openssl rand -hex 32
