# HTTP services. Each pulls all env from the shared ConfigMap + Secret, runs as
# the Workload-Identity ServiceAccount (so Vertex ADC works with no key), and
# mounts an emptyDir for the FastEmbed cache (re-downloaded on pod restart).
# ---------------------------------------------------------------- gateway
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: plantmind }
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: plantmind }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      serviceAccountName: plantmind-sa
      containers:
        - name: gateway
          image: plantmind-gateway:latest
          command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          envFrom:
            - configMapRef: { name: plantmind-config }
            - secretRef: { name: plantmind-secrets }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          volumeMounts:
            - { name: envelopes, mountPath: /srv/config }
            - { name: hf-cache, mountPath: /tmp/fastembed_cache }
          resources: { requests: { cpu: "250m", memory: "512Mi" }, limits: { memory: "1Gi" } }
      volumes:
        - { name: envelopes, configMap: { name: plantmind-envelopes } }
        - { name: hf-cache, emptyDir: {} }
---
