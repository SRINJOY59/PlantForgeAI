# ---------------------------------------------------------------- interview
# Single replica: it holds live WebRTC + session state in-process. NOTE: voice
# (WebRTC media) needs UDP that a plain HTTP Ingress does not carry — see the
# README "Voice interview" note. Text mode works over HTTP.
apiVersion: v1
kind: Service
metadata: { name: interview, namespace: plantmind }
spec:
  selector: { app: interview }
  ports: [{ name: http, port: 8002, targetPort: 8002 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: interview, namespace: plantmind }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: interview } }
  template:
    metadata: { labels: { app: interview } }
    spec:
      serviceAccountName: plantmind-sa
      containers:
        - name: interview
          image: plantmind-interview:latest
          # The Ingress routes api.<host>/interview/* here WITHOUT rewriting
          # the path (see 51-ingress.yaml), so the app serves that prefix for
          # real - INTERVIEW_PATH_PREFIX in 01-config.yaml, not --root-path,
          # which only advertises a prefix and still 404s the real request.
          command: ["uvicorn", "interview.main:app", "--host", "0.0.0.0", "--port", "8002"]
          envFrom:
            - configMapRef: { name: plantmind-config }
            - secretRef: { name: plantmind-secrets }
          ports: [{ containerPort: 8002 }]
          # the GCE ingress derives its backend health check from this probe;
          # without one it probes "/" and marks the backend unhealthy (502)
          readinessProbe:
            httpGet: { path: /interview/health, port: 8002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: { requests: { cpu: "250m", memory: "512Mi" }, limits: { memory: "1Gi" } }
---
# ---------------------------------------------------------------- tep-sim
apiVersion: v1
kind: Service
metadata: { name: tep-sim, namespace: plantmind }
spec:
  selector: { app: tep-sim }
  ports: [{ name: http, port: 8012, targetPort: 8012 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tep-sim, namespace: plantmind }
spec:
  replicas: 1                 # one authoritative simulation
  strategy: { type: Recreate }
  selector: { matchLabels: { app: tep-sim } }
  template:
    metadata: { labels: { app: tep-sim } }
    spec:
      containers:
        - name: tep-sim
          image: plantmind-simulation:latest
          command: ["python", "-m", "simulation.run", "--type", "tep"]
          env:
            - { name: SIM_PORT, value: "8012" }
          envFrom:
            - configMapRef: { name: plantmind-config }
            - secretRef: { name: plantmind-secrets }
          ports: [{ containerPort: 8012 }]
          # the integrator is real-time and CPU-bound; give it a full core so it
          # keeps up and does not stall telemetry (the "sim offline" failure)
          resources: { requests: { cpu: "1", memory: "512Mi" }, limits: { cpu: "2", memory: "1Gi" } }
