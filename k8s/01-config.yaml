# Non-secret configuration shared by every app pod. The service hostnames match
# the k8s Service names in this namespace, so the same URLs the compose network
# used (bolt://neo4j, http://retrieval, ...) resolve unchanged inside the
# cluster. Anything sensitive (keys, passwords, DSNs, JWT secret) lives in the
# Secret, NOT here — see 02-secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: plantmind-config
  namespace: plantmind
data:
  # --- internal service wiring (k8s DNS = Service names) ---
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  REDIS_URL: "redis://redis:6379/0"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_USER: "plantmind"
  RETRIEVAL_URL: "http://retrieval:8001"
  AGENTS_URL: "http://agents-api:8002"

  # --- GCP / Vertex (auth comes from Workload Identity, not a key) ---
  GCP_PROJECT: "project-1e232997-e446-4263-977"
  GOOGLE_CLOUD_PROJECT: "project-1e232997-e446-4263-977"
  VERTEX_REGION: "us-central1"
  LLM_PROVIDER: "vertex"
  VERTEX_LLM_CHEAP: "google/gemini-2.5-flash-lite"
  VERTEX_LLM_MID: "google/gemini-2.5-flash"
  VERTEX_LLM_VISION: "google/gemini-2.5-flash"
  LLM_MAX_CONCURRENCY: "32"
  LLM_MAX_RPS: "4.0"

  # --- embeddings (local FastEmbed, no key) ---
  EMBEDDING_BASE_URL: "local"

  # --- feature flags / intervals ---
  STANDARDS_WATCH_ENABLED: "false"    # the CronJob owns the scan, not the consumer loop
  SLACK_MIN_SEVERITY: "critical"

  # --- Slack as an approval gate for scheduling work ---
  # The URL Slack itself reaches the gateway on. Approval links in the Slack
  # message are built from this, so it must be the PUBLIC gateway address, not
  # the in-cluster service name.
  PUBLIC_GATEWAY_URL: "https://api.8.233.53.227.nip.io"
  SLACK_APPROVAL_TTL_S: "86400"

  # How long a translated job card is cached per (draft, language). Which
  # languages get translated is derived from the crew roster, not configured.
  DISPATCH_BRIEF_TTL_S: "604800"

  # --- interview mode. "1" forces the typed interview and the UI honours that
  #     over voice_ready, which reports only whether DEEPGRAM_API_KEY is set
  #     (STT/TTS) - it says nothing about whether media can flow. Set "1" if
  #     the WebRTC leg cannot connect; voice also needs the ICE config below. ---
  INTERVIEW_TEXT_MODE: "0"     # voice enabled; set to 1 to force the typed interview

  # --- the interview API shares the gateway's hostname under this prefix (a
  #     separate domain would re-provision the managed cert), so the app mounts
  #     its routes there. Must match the Ingress path in 51-ingress.yaml and
  #     the UI's VITE_INTERVIEW_URL. Empty (the default) serves at the root. ---
  INTERVIEW_PATH_PREFIX: "/interview"

  # --- MinIO public endpoint: the browser fetches presigned URLs from here, so
  #     it must be the gateway's public origin path to MinIO. Set after you know
  #     the Ingress host (see README). Left as the in-cluster endpoint until then. ---
  MINIO_PUBLIC_ENDPOINT: "https://api.8.233.53.227.nip.io"

  # --- CORS: the browser origin(s) allowed to call the gateway. Set to your
  #     UI's public URL once DNS/TLS is up (see README). ---
  CORS_ORIGINS: "https://ui.8.233.53.227.nip.io,http://ui.8.233.53.227.nip.io"

  # --- ICE for the voice leg. NOTE: this cluster is Autopilot, whose node pools
  #     "cannot be accessed or modified" - so the README's plan of adding a
  #     Standard node pool for coturn is not available here. A relay would have
  #     to be a separate GCE VM, an in-cluster UDP LoadBalancer, or a hosted
  #     TURN service. Until then this is STUN-only plus a firewall rule
  #     (allow-webrtc-udp-plantmind) opening the ephemeral UDP range to the
  #     nodes, betting on a direct path. ---
  STUN_URL: "stun:stun.l.google.com:19302"
  # TURN_URL must stay EMPTY until a real relay exists. The placeholder was
  # being served to browsers verbatim: TURN_SECRET is set from .env, so the
  # `if turn_url and turn_secret` guard in voice/turn.py passed and every
  # client got a relay at a hostname that does not resolve. Empty means
  # STUN-only, which is what the direct-path attempt needs.
  TURN_URL: ""
  TURN_EXTERNAL_IP: ""
