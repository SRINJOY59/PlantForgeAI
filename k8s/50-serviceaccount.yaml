# Kubernetes ServiceAccount bound to a GCP service account via Workload
# Identity. This is how pods authenticate to Vertex AI with NO key file: the
# GKE metadata server hands them the GCP SA's credentials, so google.auth
# .default() (which every LLM client uses) just works. The GCP SA must have
# roles/aiplatform.user. See the README for the two `gcloud` commands that
# create the GCP SA and wire the binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plantmind-sa
  namespace: plantmind
  annotations:
    iam.gke.io/gcp-service-account: "plantmind-vertex@REPLACE_WITH_GCP_PROJECT_ID.iam.gserviceaccount.com"
