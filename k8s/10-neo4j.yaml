apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: plantmind
spec:
  clusterIP: None            # headless: stable DNS for the StatefulSet pod
  selector: { app: neo4j }
  ports:
    - { name: bolt, port: 7687, targetPort: 7687 }
    - { name: http, port: 7474, targetPort: 7474 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: plantmind
spec:
  serviceName: neo4j
  replicas: 1
  selector: { matchLabels: { app: neo4j } }
  template:
    metadata:
      labels: { app: neo4j }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          env:
            - name: NEO4J_PASSWORD
              valueFrom: { secretKeyRef: { name: plantmind-secrets, key: NEO4J_PASSWORD } }
            # $(VAR) resolves against an env var defined earlier in this list
            - { name: NEO4J_AUTH, value: "neo4j/$(NEO4J_PASSWORD)" }
            - { name: NEO4J_PLUGINS, value: '["graph-data-science"]' }
            # GDS needs the procedures allow-listed to run
            - { name: NEO4J_dbms_security_procedures_unrestricted, value: "gds.*" }
          ports:
            - { containerPort: 7687 }
            - { containerPort: 7474 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "cypher-shell -u neo4j -p \"$NEO4J_PASSWORD\" 'RETURN 1' || exit 1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits:   { memory: "4Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
