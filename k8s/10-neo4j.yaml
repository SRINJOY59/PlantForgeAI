apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: plantmind
spec:
  clusterIP: None            # headless: stable DNS for the StatefulSet pod
  selector: { app: neo4j }
  ports:
    - { name: bolt, port: 7687, targetPort: 7687 }
    - { name: http, port: 7474, targetPort: 7474 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: plantmind
spec:
  serviceName: neo4j
  replicas: 1
  selector: { matchLabels: { app: neo4j } }
  template:
    metadata:
      labels: { app: neo4j }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          env:
            # NOT named NEO4J_* — neo4j reads every NEO4J_* env as a config
            # setting, so NEO4J_PASSWORD would be parsed as a bogus setting
            # "PASSWORD" and strict validation refuses to boot. This plain name
            # is just a shell var used to build NEO4J_AUTH.
            - name: NEO_PW
              valueFrom: { secretKeyRef: { name: plantmind-secrets, key: NEO4J_PASSWORD } }
            # $(VAR) resolves against an env var defined earlier in this list
            - { name: NEO4J_AUTH, value: "neo4j/$(NEO_PW)" }
            - { name: NEO4J_PLUGINS, value: '["graph-data-science"]' }
            # GDS needs the procedures allow-listed to run
            - { name: NEO4J_dbms_security_procedures_unrestricted, value: "gds.*" }
            # PIN the memory. Left to auto-size, Neo4j 5 grabs a large fraction of
            # the container for pagecache + heap, then GDS's off-heap on top blows
            # past the cgroup limit and the kernel OOM-kills it (the crash-loop on
            # Autopilot). Explicit, modest values leave headroom for GDS + the JVM.
            - { name: NEO4J_server_memory_heap_initial__size, value: "1500m" }
            - { name: NEO4J_server_memory_heap_max__size, value: "1500m" }
            - { name: NEO4J_server_memory_pagecache_size, value: "1g" }
          ports:
            - { containerPort: 7687 }
            - { containerPort: 7474 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "cypher-shell -u neo4j -p \"$NEO_PW\" 'RETURN 1' || exit 1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            # heap 1.5G + pagecache 1G + GDS off-heap + JVM/OS overhead: 5Gi
            # gives comfortable headroom so a GDS run can't trip the OOM-killer.
            requests: { cpu: "1", memory: "5Gi" }
            limits:   { memory: "5Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
