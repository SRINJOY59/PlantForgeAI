apiVersion: v1
kind: Service
metadata: { name: ui, namespace: plantmind }
spec:
  selector: { app: ui }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ui, namespace: plantmind }
spec:
  replicas: 2
  selector: { matchLabels: { app: ui } }
  template:
    metadata: { labels: { app: ui } }
    spec:
      containers:
        - name: ui
          image: plantmind-ui:latest
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: "50m", memory: "64Mi" }, limits: { memory: "128Mi" } }
