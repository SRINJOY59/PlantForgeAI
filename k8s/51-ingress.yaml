# Public entry. GKE ingress (a Google Cloud L7 load balancer) with a Google-
# managed TLS cert. Two hosts: the UI and the gateway API. Point both DNS
# records at the static IP you reserve in the README, then Google issues the
# cert automatically (can take ~15-60 min to go Active).
#
# Replace ui.8.233.53.227.nip.io / api.8.233.53.227.nip.io with your real domains, and set the
# same values in 01-config.yaml (CORS_ORIGINS) and the UI build args.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: plantmind-cert
  namespace: plantmind
spec:
  domains:
    - ui.8.233.53.227.nip.io
    - api.8.233.53.227.nip.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plantmind-ingress
  namespace: plantmind
  annotations:
    kubernetes.io/ingress.class: "gce"
    # reserve this global static IP first: `gcloud compute addresses create plantmind-ip --global`
    kubernetes.io/ingress.global-static-ip-name: "plantmind-ip"
    networking.gke.io/managed-certificates: "plantmind-cert"
spec:
  rules:
    - host: ui.8.233.53.227.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: ui, port: { number: 80 } } }
    - host: api.8.233.53.227.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 8000 } } }
