[project]
name = "plantmind-core"
version = "0.1.0"
description = "Shared contracts, config, LLM client and telemetry for PlantMind services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "openai>=1.40",        # OpenAI-compatible client pointed at OpenRouter
    "httpx>=0.27",
    "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plantmind_core*"]
