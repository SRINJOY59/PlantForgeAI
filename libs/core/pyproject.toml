[project]
name = "plantmind-core"
version = "0.1.0"
description = "Shared contracts, config, LLM client and telemetry for PlantMind services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "openai>=1.40",        # OpenAI-compatible client pointed at OpenRouter
    "httpx>=0.27",
    "redis>=5.0",
    "minio>=7.2",
]

[project.optional-dependencies]
celery = ["celery[redis]>=5.4"]     # only worker services need this
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plantmind_core*"]
