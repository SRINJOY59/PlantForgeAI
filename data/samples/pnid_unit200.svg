<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="monospace" font-size="14">
  <rect width="1200" height="640" fill="white"/>
  <text x="20" y="30" font-size="18">UNIT 200 - VAPOUR PROCESSING    DWG U200-PID-001 REV 1</text>

  <!-- inlet from K-301 -->
  <text x="30" y="205">FROM K-301</text>
  <text x="30" y="222">(UNIT 100)</text>
  <line x1="30" y1="240" x2="150" y2="240" stroke="black" stroke-width="2"/>

  <!-- E-210 aftercooler -->
  <circle cx="200" cy="240" r="45" fill="none" stroke="black" stroke-width="2"/>
  <line x1="155" y1="240" x2="245" y2="240" stroke="black" stroke-width="2"/>
  <path d="M 170 240 L 190 225 L 210 255 L 230 240" fill="none" stroke="black" stroke-width="2"/>
  <text x="175" y="310">E-210</text>
  <text x="145" y="328">AFTERCOOLER</text>

  <!-- TI-211 on E-210 outlet -->
  <line x1="245" y1="240" x2="360" y2="240" stroke="black" stroke-width="2"/>
  <circle cx="300" cy="200" r="18" fill="none" stroke="black" stroke-width="2"/>
  <text x="293" y="196" font-size="12">TI</text>
  <text x="289" y="210" font-size="12">211</text>
  <line x1="300" y1="218" x2="300" y2="240" stroke="black" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- V-210 KO drum -->
  <rect x="360" y="150" width="80" height="190" rx="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="372" y="140">V-210</text>
  <text x="352" y="365">KO DRUM</text>

  <!-- LT-212 on V-210 -->
  <circle cx="480" cy="300" r="18" fill="none" stroke="black" stroke-width="2"/>
  <text x="472" y="296" font-size="12">LT</text>
  <text x="468" y="310" font-size="12">212</text>
  <line x1="440" y1="300" x2="462" y2="300" stroke="black" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- PSV-210 on V-210 top -->
  <line x1="400" y1="150" x2="400" y2="105" stroke="black" stroke-width="2"/>
  <path d="M 385 105 L 415 105 L 400 80 Z" fill="none" stroke="black" stroke-width="2"/>
  <text x="425" y="98">PSV-210</text>
  <line x1="400" y1="80" x2="400" y2="50" stroke="black" stroke-width="2"/>
  <text x="360" y="42">TO FLARE</text>

  <!-- vapour to C-220 -->
  <line x1="440" y1="180" x2="620" y2="180" stroke="black" stroke-width="2"/>
  <line x1="620" y1="180" x2="620" y2="460" stroke="black" stroke-width="2"/>
  <line x1="620" y1="460" x2="700" y2="460" stroke="black" stroke-width="2"/>

  <!-- C-220 column -->
  <rect x="700" y="120" width="90" height="380" rx="45" fill="none" stroke="black" stroke-width="2"/>
  <line x1="705" y1="220" x2="785" y2="220" stroke="black" stroke-width="1"/>
  <line x1="705" y1="300" x2="785" y2="300" stroke="black" stroke-width="1"/>
  <line x1="705" y1="380" x2="785" y2="380" stroke="black" stroke-width="1"/>
  <text x="712" y="110">C-220</text>
  <text x="690" y="525">ABSORBER</text>

  <!-- PDI-221 across column -->
  <circle cx="655" cy="260" r="18" fill="none" stroke="black" stroke-width="2"/>
  <text x="643" y="256" font-size="11">PDI</text>
  <text x="645" y="270" font-size="11">221</text>
  <line x1="673" y1="260" x2="700" y2="260" stroke="black" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- treated gas out -->
  <line x1="745" y1="120" x2="745" y2="70" stroke="black" stroke-width="2"/>
  <line x1="745" y1="70" x2="1160" y2="70" stroke="black" stroke-width="2"/>
  <text x="960" y="58">TREATED GAS TO BATTERY LIMIT</text>

  <!-- lean solvent pumps -->
  <text x="880" y="330">LEAN SOLVENT</text>
  <text x="880" y="348">FROM REGEN</text>
  <line x1="890" y1="365" x2="890" y2="420" stroke="black" stroke-width="2"/>
  <line x1="890" y1="420" x2="930" y2="420" stroke="black" stroke-width="2"/>
  <line x1="930" y1="360" x2="930" y2="480" stroke="black" stroke-width="2"/>

  <circle cx="990" cy="360" r="35" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 990 325 L 1018 385 L 962 385" fill="none" stroke="black" stroke-width="2" transform="rotate(180 990 360)"/>
  <text x="1040" y="365">P-201A</text>
  <circle cx="990" cy="480" r="35" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 990 445 L 1018 505 L 962 505" fill="none" stroke="black" stroke-width="2" transform="rotate(180 990 480)"/>
  <text x="1040" y="485">P-201B</text>
  <line x1="930" y1="360" x2="955" y2="360" stroke="black" stroke-width="2"/>
  <line x1="930" y1="480" x2="955" y2="480" stroke="black" stroke-width="2"/>

  <!-- pump discharge header to column top -->
  <line x1="1025" y1="360" x2="1100" y2="360" stroke="black" stroke-width="2"/>
  <line x1="1025" y1="480" x2="1100" y2="480" stroke="black" stroke-width="2"/>
  <line x1="1100" y1="360" x2="1100" y2="480" stroke="black" stroke-width="2"/>
  <line x1="1100" y1="420" x2="1130" y2="420" stroke="black" stroke-width="2"/>
  <line x1="1130" y1="420" x2="1130" y2="150" stroke="black" stroke-width="2"/>
  <line x1="1130" y1="150" x2="790" y2="150" stroke="black" stroke-width="2"/>

  <!-- FT-222 on solvent line -->
  <circle cx="1000" cy="200" r="18" fill="none" stroke="black" stroke-width="2"/>
  <text x="992" y="196" font-size="12">FT</text>
  <text x="988" y="210" font-size="12">222</text>
  <line x1="1000" y1="182" x2="1000" y2="150" stroke="black" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- rich solvent out -->
  <line x1="745" y1="500" x2="745" y2="580" stroke="black" stroke-width="2"/>
  <line x1="745" y1="580" x2="1160" y2="580" stroke="black" stroke-width="2"/>
  <text x="920" y="568">RICH SOLVENT TO REGEN</text>

  <!-- V-210 boot drain -->
  <line x1="400" y1="340" x2="400" y2="420" stroke="black" stroke-width="2"/>
  <line x1="400" y1="420" x2="540" y2="420" stroke="black" stroke-width="2"/>
  <text x="420" y="440">BOOT DRAIN TO CLOSED DRAIN</text>
</svg>
