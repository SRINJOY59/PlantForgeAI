  .ps    { fill:#64748B; font-size:11px; }
  .chip  { fill:#FFFFFF; stroke:#FCA5A5; stroke-width:1.2; }
  .ct    { fill:#B91C1C; font-size:10px; font-weight:700; }
  .cb    { fill:#475569; font-size:9.5px; }
  .it    { fill:#0F172A; font-size:10px; font-weight:700; }
  .ib    { fill:#64748B; font-size:9px; }
