  .panG  { fill:#ECFDF5; stroke:#059669; stroke-width:1.8; }
  .panB  { fill:#F8FAFC; stroke:#2563EB; stroke-width:1.8; }
  .panS  { fill:#F8FAFC; stroke:#CBD5E1; stroke-width:1.5; }
