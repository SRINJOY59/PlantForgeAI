server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: client-side routes (/app, /field, ...) must all serve index.html
    # rather than 404, or a hard refresh on a deep link breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted assets; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # GKE ingress health check hits /
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
