x-service-base: &svc
  env_file: .env
  # .env carries localhost URLs so the same file works for local dev
  # (tools.serve); inside the compose network the infra is reachable by
  # service name, and these overrides win over env_file.
  environment: &svc-env
    NEO4J_URI: bolt://neo4j:7687
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: http://minio:9000
    RETRIEVAL_URL: http://retrieval:8001
    AGENTS_URL: http://agents-api:8002
    CSTR_SIM_URL: http://cstr-sim:8010
    COLUMN_SIM_URL: http://column-sim:8011
  depends_on:
    redis: { condition: service_healthy }
    neo4j: { condition: service_healthy }
    minio: { condition: service_started }
  restart: unless-stopped

# celery reads SIGTERM as a warm shutdown: finish the running task, ack it,
# then exit. Docker SIGKILLs after stop_grace_period, and the 10s default is
# nowhere near our 600s task_time_limit - a worker killed mid-task leaves it
# unacked, and the redis broker will not redeliver until visibility_timeout,
# an hour later. So the grace matches the task limit. Idle workers still exit
# in about a second; this is a ceiling, not a wait.
x-worker: &worker
  <<: *svc
  stop_grace_period: 600s

services:
  # ---------- infrastructure ----------
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data", "./infra/neo4j:/init:ro"]
    healthcheck:
      # single $ so compose substitutes the password here at parse time: the
      # neo4j container has no NEO4J_PASSWORD of its own (and NEO4J_* vars
      # would be read as neo4j config settings, which this is not)
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # one-shot: applies constraints + the vector index once neo4j is up.
  # Without this the graph has no indexes and vector search fails.
  graph-init:
    image: neo4j:5-community
    depends_on:
      neo4j: { condition: service_healthy }
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes: ["./infra/neo4j:/init:ro"]
    entrypoint: ["bash", "-c",
      "cypher-shell -a bolt://neo4j:7687 -u neo4j -p $${NEO4J_PASSWORD} -f /init/init.cypher && echo schema applied"]
    restart: "no"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  # ---------- application services ----------
  # all built from infra/docker/service.Dockerfile; SERVICE arg picks the code
  # The stateless HTTP services (gateway, retrieval, agents-api) run multiple
  # uvicorn worker processes for CPU-parallel request handling; each worker is
  # its own event loop and thread pool, and they share all state through Redis
  # (answer cache, rate limits, alert stream) and Neo4j. Tune with *_WORKERS.
  # interview is deliberately NOT multi-worker: it holds session and live
  # WebRTC state in-process, so a second worker would not see a user's session.
  gateway:
    <<: *svc
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: gateway }
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 --workers ${GATEWAY_WORKERS:-2}
    ports: ["8000:8000"]

  ingestion:
    <<: *worker
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: ingestion }
    command: celery -A ingestion.tasks worker -Q q_classify -c 4

  extraction-wo:
    <<: *worker
    build: &extraction-build
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: extraction }
    command: celery -A extraction.tasks worker -Q q_parse_wo -c 8

  extraction-pnid:
    <<: *worker
    build: *extraction-build
    command: celery -A extraction.tasks worker -Q q_extract_pnid -c 4

  extraction-text:
    <<: *worker
    build: *extraction-build
    command: celery -A extraction.tasks worker -Q q_extract_text -c 32

  resolution:
    <<: *worker
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: resolution }
    command: celery -A resolution.tasks worker -Q q_resolve -c 4

  graphd:
    <<: *worker
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: graphd }
    # single writer: concurrency MUST stay 1; beat drives flush + denoise.
    # the autoscaler pins this too (ComposeFleet.SPECS), so it is guarded in
    # two places.
    command: celery -A graphd.tasks worker -Q q_write -c 1 -B --loglevel=info

  connectors:
    <<: *worker
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: connectors }
    # the connector definitions and the watched folder live outside the image
    volumes:
      - ./connectors.json:/srv/connectors.json:ro
      - ./data/inbox:/srv/data/inbox
    # beat drives scheduled data-source syncs into the pipeline
    command: celery -A connectors.tasks worker -Q q_connectors -c 2 -B --loglevel=info

  retrieval:
    <<: *svc
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: retrieval }
    command: uvicorn retrieval.main:app --host 0.0.0.0 --port 8001 --workers ${RETRIEVAL_WORKERS:-2}
    ports: ["8001:8001"]

  agents:
    <<: *svc
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: agents }
    # watch the standards this plant is held to. Off by default because each
    # sweep is a billed web search; on here so the feature runs in this
    # deployment. Use `python -m tools.standards_demo` to see an alert on
    # demand without waiting for a real revision to move. Merge the shared env
    # rather than replace it, or the consumer loses NEO4J_URI/REDIS_URL/...
    environment:
      <<: *svc-env
      STANDARDS_WATCH_ENABLED: "false"
    command: python -m agents.consumer

  # the same image and the same reasoning as `agents`, reached the other way
  # round: the consumer waits for the plant to change, this waits for a person
  # to ask. Separate processes because the consumer's job is to never stop
  # tailing the delta stream, and a request that blocks on an LLM for half a
  # minute has no business sharing that loop.
  agents-api:
    <<: *svc
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: agents }
    command: uvicorn agents.main:app --host 0.0.0.0 --port 8002 --workers ${AGENTS_API_WORKERS:-2}
    ports: ["8002:8002"]

  # knowledge-capture voice interview (services/interview). Voice needs
  # DEEPGRAM_API_KEY in .env; without it the service still runs and serves
  # the text-mode interview. Host port is 8003, not 8002: agents-api already
  # owns 8002, and the interview UI reaches this directly (VITE_INTERVIEW_URL,
  # default localhost:8003), so the two backends can't share a host port.
  interview:
    <<: *svc
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: interview }
    command: uvicorn interview.main:app --host 0.0.0.0 --port 8002
    ports: ["8003:8002"]
    volumes:
      - ./data/interviews:/srv/data/interviews

  # watches queue depth and scales the worker services to match. It is the one
  # service that talks to the docker daemon rather than to redis alone, which
  # is why it gets the socket and its own image.
  autoscaler:
    build:
      context: .
      dockerfile: infra/docker/autoscaler.Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # the same compose file the host uses, so the two cannot drift. .env
      # rides along because compose needs it to resolve ${NEO4J_PASSWORD}
      # when it parses that file.
      - ./docker-compose.yml:/srv/docker-compose.yml:ro
      - ./.env:/srv/.env:ro
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    command: python -m tools.autoscale

  # ---------- Tennessee Eastman Process simulator & topology seed ----------
  tep-sim:
    build:
      context: .
      dockerfile: infra/docker/simulation.Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      SIM_PORT: "8012"
    # NOT exposed to the host: accessed only via the gateway proxy
    ports: []
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    command: python -m simulation.run --type tep

  # one-shot: seeds TEP topology into Neo4j on deploy (idempotent).
  # Its own image (seed.Dockerfile): the seed needs the scripts, the simulation
  # topology package and the neo4j driver together, which no service image
  # ships. The agents image it used to borrow carried neither the script nor
  # the topology, so this job failed at startup on every deploy.
  tep-seed:
    build:
      context: .
      dockerfile: infra/docker/seed.Dockerfile
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j: { condition: service_healthy }
    entrypoint: ["python", "scripts/seed_tep_topology.py"]
    restart: "no"

  tep-watcher:
    <<: *svc
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: agents }
    volumes:
      - ./config:/srv/config:ro
    command: python -m agents.watchers.tep

volumes:
  neo4j_data:
  redis_data:
  minio_data:
